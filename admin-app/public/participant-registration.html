<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFA Participant Registration</title>
  <style>
    :root {
      --bg: #f4f8fb;
      --card: #ffffff;
      --text: #11324f;
      --muted: #5e7389;
      --line: #d0ddea;
      --primary: #0d6ca9;
      --primary-strong: #0a537f;
      --ok: #166534;
      --warn: #9a3412;
      --err: #b91c1c;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #e4f0fa 0%, var(--bg) 52%);
    }

    .shell {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 14px 34px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(14, 45, 73, 0.08);
      margin-bottom: 14px;
    }

    h1, h2, h3 { margin: 0 0 10px; }
    p { margin: 0 0 10px; }
    .muted { color: var(--muted); }

    .row {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 640px) {
      .row.two { grid-template-columns: 1fr 1fr; }
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: block;
      margin-bottom: 5px;
    }

    input, button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 11px;
      font: inherit;
    }

    input:focus {
      outline: none;
      border-color: #7aaed1;
      box-shadow: 0 0 0 3px rgba(13, 108, 169, 0.12);
    }

    .btn {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover { background: var(--primary-strong); }
    .btn.secondary {
      background: #fff;
      color: var(--primary);
      border-color: #9dc3dd;
    }

    .status {
      min-height: 20px;
      font-weight: 600;
      font-size: 13px;
    }

    .status.ok { color: var(--ok); }
    .status.warn { color: var(--warn); }
    .status.err { color: var(--err); }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      border: 1px solid #b8d2e5;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      color: #0d5d90;
      background: #ecf6fd;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <h1>Participant Registration</h1>
      <p class="muted">Use your event slug to load registration details and submit intake.</p>
      <div class="row two">
        <div>
          <label for="eventSlug">Event Slug</label>
          <input id="eventSlug" type="text" placeholder="example: jupiter-chapter-june-2026" />
        </div>
        <div style="display:flex;align-items:end;gap:8px;">
          <button id="loadEventButton" class="btn" type="button">Load Event</button>
        </div>
      </div>
      <div id="loadStatus" class="status"></div>
    </section>

    <section id="eventCard" class="card hidden">
      <h2 id="eventTitle">Event</h2>
      <p id="eventSummary" class="muted"></p>
      <div>
        <span id="availabilityPill" class="pill"></span>
      </div>
    </section>

    <section id="registerCard" class="card hidden">
      <h3>Register Participant</h3>
      <form id="registrationForm" class="row" autocomplete="on">
        <div class="row two">
          <div>
            <label for="firstName">First Name</label>
            <input id="firstName" name="firstName" type="text" required />
          </div>
          <div>
            <label for="lastName">Last Name</label>
            <input id="lastName" name="lastName" type="text" required />
          </div>
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>

        <div>
          <label>
            <input id="isMinor" name="isMinor" type="checkbox" style="width:auto;margin-right:8px;" />
            Participant is a minor
          </label>
        </div>

        <div class="row two">
          <button id="submitButton" class="btn" type="submit">Submit Registration</button>
          <button id="clearButton" class="btn secondary" type="button">Clear Form</button>
        </div>
      </form>
      <div id="submitStatus" class="status"></div>
    </section>
  </main>

  <script>
    (function () {
      const DEFAULT_PROD_API_BASE = "https://sfa-admin-testing.onrender.com";

      function isPrivateOrLoopbackHost(hostname) {
        const host = String(hostname || "").toLowerCase();
        if (!host) return true;
        if (host === "localhost" || host === "127.0.0.1" || host === "::1") return true;
        if (host.startsWith("10.")) return true;
        if (host.startsWith("192.168.")) return true;
        if (host.startsWith("169.254.")) return true;
        if (/^172\.(1[6-9]|2\d|3[0-1])\./.test(host)) return true;
        return false;
      }

      function getApiBase() {
        const host = window.location.hostname;
        if (isPrivateOrLoopbackHost(host)) {
          return window.location.protocol + "//" + host + ":8000";
        }
        return DEFAULT_PROD_API_BASE;
      }

      const apiBase = getApiBase();
      const eventSlugInput = document.getElementById("eventSlug");
      const loadEventButton = document.getElementById("loadEventButton");
      const loadStatus = document.getElementById("loadStatus");
      const eventCard = document.getElementById("eventCard");
      const registerCard = document.getElementById("registerCard");
      const eventTitle = document.getElementById("eventTitle");
      const eventSummary = document.getElementById("eventSummary");
      const availabilityPill = document.getElementById("availabilityPill");
      const form = document.getElementById("registrationForm");
      const submitButton = document.getElementById("submitButton");
      const clearButton = document.getElementById("clearButton");
      const submitStatus = document.getElementById("submitStatus");

      let currentEventSlug = "";

      function setStatus(node, text, tone) {
        node.textContent = text || "";
        node.className = "status" + (tone ? " " + tone : "");
      }

      function toDateLabel(startDate, endDate) {
        if (!startDate) return "Date not set";
        const start = new Date(startDate + "T00:00:00");
        const options = { month: "short", day: "numeric", year: "numeric" };
        const startLabel = start.toLocaleDateString([], options);
        if (!endDate || endDate === startDate) return startLabel;
        const end = new Date(endDate + "T00:00:00");
        return startLabel + " to " + end.toLocaleDateString([], options);
      }

      function parseSlugFromQuery() {
        const params = new URLSearchParams(window.location.search);
        return String(params.get("slug") || "").trim();
      }

      async function loadEvent() {
        const slug = String(eventSlugInput.value || "").trim();
        if (!slug) {
          setStatus(loadStatus, "Enter an event slug.", "warn");
          return;
        }

        setStatus(loadStatus, "Loading event...", "");
        setStatus(submitStatus, "", "");

        try {
          const res = await fetch(apiBase + "/api/events/" + encodeURIComponent(slug), {
            method: "GET",
            headers: { "Accept": "application/json" }
          });

          if (!res.ok) {
            if (res.status === 404) {
              throw new Error("Event not found. Check the slug and try again.");
            }
            throw new Error("Could not load event details.");
          }

          const event = await res.json();
          currentEventSlug = slug;
          eventTitle.textContent = event.title || "Event";
          eventSummary.textContent = toDateLabel(event.start_date, event.end_date) + " • " +
            [event.location && event.location.venue, event.location && event.location.city, event.location && event.location.state]
              .filter(Boolean)
              .join(", ");

          const participantOpen = Boolean(event.registration && event.registration.participant_open);
          availabilityPill.textContent = participantOpen ? "Participant registration is open" : "Participant registration is closed";
          availabilityPill.style.background = participantOpen ? "#e9f7f0" : "#fff3e2";
          availabilityPill.style.borderColor = participantOpen ? "#b7e4cb" : "#f7d7b2";
          availabilityPill.style.color = participantOpen ? "#166534" : "#9a3412";

          eventCard.classList.remove("hidden");
          registerCard.classList.remove("hidden");
          setStatus(loadStatus, "Event loaded.", "ok");
        } catch (err) {
          currentEventSlug = "";
          eventCard.classList.add("hidden");
          registerCard.classList.add("hidden");
          setStatus(loadStatus, String(err && err.message ? err.message : "Failed to load event."), "err");
        }
      }

      async function submitRegistration(e) {
        e.preventDefault();

        if (!currentEventSlug) {
          setStatus(submitStatus, "Load an event before submitting.", "warn");
          return;
        }

        const payload = {
          first_name: String(document.getElementById("firstName").value || "").trim(),
          last_name: String(document.getElementById("lastName").value || "").trim(),
          email: String(document.getElementById("email").value || "").trim(),
          role: "participant",
          is_minor: Boolean(document.getElementById("isMinor").checked)
        };

        if (!payload.first_name || !payload.last_name || !payload.email) {
          setStatus(submitStatus, "Complete all required fields.", "warn");
          return;
        }

        submitButton.disabled = true;
        setStatus(submitStatus, "Submitting registration...", "");

        try {
          const res = await fetch(apiBase + "/api/public/events/" + encodeURIComponent(currentEventSlug) + "/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const body = await res.json().catch(function () { return {}; });
            const detail = String(body && body.detail ? body.detail : "Registration failed.");
            if (res.status === 409) {
              throw new Error("This email is already registered for this event.");
            }
            throw new Error(detail);
          }

          setStatus(submitStatus, "Registration submitted successfully. You are now in intake and waiting assignment.", "ok");
          form.reset();
        } catch (err) {
          setStatus(submitStatus, String(err && err.message ? err.message : "Registration failed."), "err");
        } finally {
          submitButton.disabled = false;
        }
      }

      loadEventButton.addEventListener("click", loadEvent);
      form.addEventListener("submit", submitRegistration);
      clearButton.addEventListener("click", function () {
        form.reset();
        setStatus(submitStatus, "", "");
      });

      const slugFromQuery = parseSlugFromQuery();
      if (slugFromQuery) {
        eventSlugInput.value = slugFromQuery;
        loadEvent();
      }
    })();
  </script>
</body>
</html>
