<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SFA Admin</title>
    <script>
      // GitHub Pages SPA redirect — preserves the path by encoding it into the query string.
      // segmentCount = 1 matches the single-segment repo base path (/sfa-admin-testing/).
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
