services:
  - type: web
    name: sfa-api
    runtime: python
    plan: starter
    buildCommand: pip install -r api/requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DEBUG
        value: false

      - key: BACKEND_SECRET_KEY
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 720

      - key: CORS_ORIGINS
        sync: false

      - key: CANONICAL_SIGNING_ORIGIN
        sync: false

      # Email delivery (see DEVELOPMENT_WORKFLOW.md for setup steps). This
      # service is not Blueprint-synced, so these declarations are
      # documentation only - the actual values must be set by hand in the
      # Render dashboard's Environment tab, same as CORS_ORIGINS/
      # CANONICAL_SIGNING_ORIGIN above. Production refuses to start
      # (api/main.py's _enforce_startup_guardrails) if these resolve to the
      # no-op provider.
      - key: EMAIL_PROVIDER_KEY
        sync: false

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        sync: false

      - key: SMTP_USERNAME
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: EMAIL_DEFAULT_SENDER
        sync: false

      - key: EMAIL_SENDER_DISPLAY_NAME
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: sfa-db
          property: connectionString


databases:
  - name: sfa-db
    plan: starter