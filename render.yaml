services:
  - type: web
    name: sfa-api
    env: python
    plan: starter
    buildCommand: pip install -r api/requirements.txt
    startCommand: alembic upgrade head && python -m uvicorn main:app --app-dir api --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEBUG
        value: false
      - key: BACKEND_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 720
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sfa-db
          property: connectionString

  - type: static
    name: sfa-admin
    rootDir: admin-app
    buildCommand: npm ci && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sfa-api
          property: url

databases:
  - name: sfa-db
    plan: starter
