services:
  - type: web
    name: sfa-api
    runtime: python
    plan: starter
    buildCommand: pip install -r api/requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DEBUG
        value: false

      - key: BACKEND_SECRET_KEY
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 720

      - key: CORS_ORIGINS
        sync: false

      - key: CANONICAL_SIGNING_ORIGIN
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: sfa-db
          property: connectionString


databases:
  - name: sfa-db
    plan: starter