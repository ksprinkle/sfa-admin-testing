services:
  - type: web
    name: sfa-api
    runtime: python
    plan: starter
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DEBUG
        value: false

      - key: BACKEND_SECRET_KEY
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 720

      - key: CORS_ORIGINS
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: sfa-db
          property: connectionString


databases:
  - name: sfa-db
    plan: starter